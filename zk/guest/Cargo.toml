[package]
name = "qs_guest"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
name = "qs_core"
path = "src/lib.rs"

[[bin]]
name = "qs_guest"
path = "src/main.rs"

[dependencies]
risc0-zkvm = { version = "^3.0.6", default-features = false, features = ['std'] }
bytemuck = "1"

[profile.release]
opt-level = 3
